[project]
name = "audio-search-hybrid-retrieval"
version = "0.1.0"
description = "Hybrid (keyword + semantic) search over diarized/transcribed audio conversations, backed by Postgres + pgvector."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "asyncpg>=0.29",
    "pgvector>=0.2.5",
    "sentence-transformers>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
transcription = ["openai-whisper", "faster-whisper"]
diarization = ["pyannote.audio"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
